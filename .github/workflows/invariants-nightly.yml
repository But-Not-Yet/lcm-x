name: Invariants nightly
on:
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["tests/invariants/**", ".github/workflows/invariants-nightly.yml"]
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      HERMES_DISABLE_LAZY_INSTALLS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with: {python-version: "3.12"}
      - run: pip install pytest numpy hypothesis==6.141.1
      # keep identical to ci.yml's stub step
      - name: Stub hermes-agent ABC
        run: |
          mkdir -p agent
          cat > agent/__init__.py <<'STUB'
          STUB
          cat > agent/context_engine.py <<'STUB'
          """Minimal stub of hermes-agent ContextEngine ABC for CI."""
          class ContextEngine:
              """Base class stub — just enough for LCMEngine to import."""
              def __init__(self, **kwargs):
                  self.compression_count = 0
                  self.last_prompt_tokens = 0
              def compress(self, messages, current_tokens=None, **kwargs):
                  raise NotImplementedError
              def on_session_start(self, session_id, **kwargs):
                  pass
              def on_session_end(self, **kwargs):
                  pass
              def on_session_reset(self):
                  self.compression_count = 0
                  self.last_prompt_tokens = 0
              def get_tool_schemas(self):
                  return []
              def handle_tool_call(self, name, args, **kwargs):
                  raise NotImplementedError
              def get_status(self):
                  return {}
          STUB

      - name: Run nightly invariants
        run: |
          set +e
          LCM_HYPOTHESIS_PROFILE=nightly python -m pytest tests/invariants -q -rx -p no:randomly 2>&1 | tee "$RUNNER_TEMP/invariants-pytest.log"
          result=${PIPESTATUS[0]}
          { tail -n 1 "$RUNNER_TEMP/invariants-pytest.log"; echo "pytest exit code: $result"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Preserve Hypothesis examples on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: invariants-hypothesis, path: .hypothesis, include-hidden-files: true}
